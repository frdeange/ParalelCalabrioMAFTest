name: infra-validate

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-validate.yml"
  push:
    branches: [develop, main]
    paths:
      - "infra/**"

jobs:
  bicep-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install && az bicep version

      - name: Lint Bicep
        run: |
          find infra -name "*.bicep" -print0 | xargs -0 -n1 az bicep build --file
          # If any compile fails, exit non-zero

      - name: APIM policy XML lint
        run: |
          # very basic well-formed XML check
          for f in infra/apim-policies/**/*.xml; do
            xmllint --noout "$f" || exit 1
          done
        # xmllint comes preinstalled on ubuntu-latest

