name: mcp-ci

on:
  pull_request:
    paths:
      - "apps/mcp/**"
      - ".github/workflows/mcp-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/mcp/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ODBC driver (msodbcsql18)
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt update
          sudo ACCEPT_EULA=Y apt install -y msodbcsql18

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v --cov=app --cov-report=term-missing

      # Opt-in integration suite (issue #23). Spins up an mssql
      # testcontainer, bootstraps ``database/01-03*.sql`` and exercises
      # the schema + query tools end-to-end. Kept in the same job (not
      # a separate ``needs``-gated one) so the Python setup + ODBC
      # install above are reused; runs after the fast unit suite so a
      # broken unit test fails the build quickly.
      #
      # Coverage is deliberately *not* re-uploaded here: the unit run
      # already enforces the gate, and counting integration tests
      # twice would double-count assertions and mask regressions.
      - name: Integration tests (mssql testcontainer)
        env:
          MCP_RUN_INTEGRATION: "1"
        run: pytest tests/integration -v --no-cov

  docker-build:
    # Activated automatically once apps/mcp/Dockerfile lands (issue #24).
    if: hashFiles('apps/mcp/Dockerfile') != ''
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mcp:ci apps/mcp
