[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata — self-contained drift checker, not part of any app.
# Lives under database/scripts/ so the data team owns the catalog
# health-check independently from apps/mcp.
# ---------------------------------------------------------------------------
[project]
name = "wfm-drift-check"
version = "0.1.0"
description = "Read-only drift checker between _metadata.catalog_* and INFORMATION_SCHEMA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "frdeange" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# Runtime deps:
#   - pyodbc        → Azure SQL via Microsoft ODBC Driver 18 (system
#                     package installed by the dev container).
#   - azure-identity → DefaultAzureCredential for the
#                      ``https://database.windows.net/.default`` token.
# Mirrors the pinning style of apps/mcp/pyproject.toml so dependency
# drift between the two services is visible at a glance.
dependencies = [
    "pyodbc>=5.2",
    "azure-identity>=1.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[project.scripts]
check-metadata-drift = "check_metadata_drift:main"

# ---------------------------------------------------------------------------
# Build configuration — single-module wheel (no package directory).
# ---------------------------------------------------------------------------
[tool.setuptools]
py-modules = ["check_metadata_drift"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["check_metadata_drift"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # long lines tolerated, mostly in docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
