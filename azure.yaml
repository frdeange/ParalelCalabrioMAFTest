# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: wfm-data-assistant
services:
    wfm:
        project: ./foundry_hosted
        host: azure.ai.agent
        language: docker
        docker:
            path: ./Dockerfile
            context: .
        config:
            container:
                resources:
                    cpu: "0.5"
                    memory: 1Gi
