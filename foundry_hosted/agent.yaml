# agent.yaml — runtime configuration for the hosted agent.
# Read by `azd ai agent run` (local dev) and `azd deploy` (production).

kind: hosted
name: wfm-data-assistant
protocols:
  - protocol: responses
    version: 1.0.0

resources:
  cpu: "0.5"
  memory: 1Gi

environment_variables:
  # FOUNDRY_* and AGENT_* are reserved by the Foundry hosting platform — do not declare here.
  # AZURE_AI_MODEL_DEPLOYMENT_NAME is user-declared (mapped from azd env).
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  # Enable richer GenAI spans (input/output, tool args, etc.) in App Insights.
  - name: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING
    value: "true"
  # Workflow-specific config (resolved from the azd env).
  - name: BU_ID
    value: ${BU_ID}
  - name: MCP_SERVER_URL
    value: ${MCP_SERVER_URL}
