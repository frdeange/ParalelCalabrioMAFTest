name: backend-ci

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/backend/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app
        continue-on-error: true # TODO remove once typed

      - name: Test (with coverage)
        # ``--cov-fail-under`` is also enforced in pyproject.toml; passing
        # it explicitly here keeps the gate visible in CI logs and lets us
        # bump it independently of local dev settings.
        run: |
          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=70

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: apps/backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: apps/backend/htmlcov
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    # Activated automatically once apps/backend/Dockerfile lands (issue #15).
    # Until then the job is skipped, which is treated as success by required
    # status checks — no false failures on PRs that only touch app code.
    if: hashFiles('apps/backend/Dockerfile') != ''
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t backend:ci apps/backend
