name: backend-ci

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/backend/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app
        continue-on-error: true # TODO remove once typed

      - name: Test
        run: pytest -v --cov=app --cov-report=term-missing

  docker-build:
    # Activated automatically once apps/backend/Dockerfile lands (issue #15).
    # Until then the job is skipped, which is treated as success by required
    # status checks — no false failures on PRs that only touch app code.
    if: hashFiles('apps/backend/Dockerfile') != ''
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t backend:ci apps/backend
