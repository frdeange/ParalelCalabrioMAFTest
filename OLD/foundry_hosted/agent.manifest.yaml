# agent.manifest.yaml — consumed by `azd ai agent init` to scaffold the
# project locally and to create the Foundry agent template + dependent
# Azure resources during `azd provision`.
#
# Usage:
#   azd ai agent init -m ./agent.manifest.yaml
#   azd provision     # only if you don't already have a Foundry project
#   azd deploy

name: wfm-data-assistant
description: >
  WFM data assistant: an Agent Framework workflow (intent classifier →
  SQL builder → query executor) hosted on Foundry. Calls a remote MCP
  server for live table metadata and query execution; final answer is
  delivered in the user's language.
metadata:
  tags:
    - Agent Framework
    - Foundry Hosted Agent
    - WFM
    - Sequential Workflow
    - Local MCP
    - Responses Protocol

template:
  name: wfm-data-assistant
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    # FOUNDRY_* and AGENT_* are reserved by the Foundry hosting platform — do not declare here.
    # AZURE_AI_MODEL_DEPLOYMENT_NAME is user-declared (resolved from azd env / model resource).
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    # Enable richer GenAI spans (input/output, tool args, etc.) in App Insights.
    - name: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING
      value: "true"
    - name: BU_ID
      value: "{{BU_ID}}"
    - name: MCP_SERVER_URL
      value: "{{MCP_SERVER_URL}}"

resources:
  - kind: model
    id: AZURE_AI_MODEL_DEPLOYMENT_NAME
    name: gpt-5.2
