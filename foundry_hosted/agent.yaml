# agent.yaml — runtime configuration for the hosted agent.
# Read by `azd ai agent run` (local dev) and `azd deploy` (production).

kind: hosted
name: wfm-data-assistant
protocols:
  - protocol: responses
    version: 1.0.0

resources:
  cpu: "0.5"
  memory: 1Gi

environment_variables:
  # Auto-injected by Foundry hosting at runtime.
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  # Workflow-specific config (resolved from the azd env).
  - name: FOUNDRY_MODEL
    value: ${FOUNDRY_MODEL}
  - name: BU_ID
    value: ${BU_ID}
  - name: MCP_SERVER_URL
    value: ${MCP_SERVER_URL}
