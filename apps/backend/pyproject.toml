[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "wfm-backend"
version = "0.1.0"
description = "WFM Data Assistant — backend service (MAF workflow + AG-UI endpoint)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "frdeange" }]
keywords = ["wfm", "agent-framework", "maf", "fastapi", "ag-ui"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# Runtime dependencies. Keep this list aligned with PLAN.md §4 Backend stack.
# Versions pinned for the meta packages where stability matters; otherwise
# floor-only so we pick up patches.
dependencies = [
    "agent-framework==1.6.0",
    "agent-framework-azure-cosmos",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "azure-identity>=1.19",
    "azure-cosmos>=4.7",
    "azure-monitor-opentelemetry>=1.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/frdeange/ParalelCalabrioMAFTest"
Issues = "https://github.com/frdeange/ParalelCalabrioMAFTest/issues"

# ---------------------------------------------------------------------------
# Build configuration (hatchling)
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "tests", "README.md", "pyproject.toml", ".env.example"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["agent_framework.*", "agent_framework_azure_cosmos.*"]
ignore_missing_imports = true
